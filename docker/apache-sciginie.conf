# วางไฟล์นี้บนเซิร์ฟเวอร์คณะ แล้วชี้ URL /app/sciginie ไปยังโฟลเดอร์โปรเจกต์
# ตัวอย่าง: /etc/apache2/conf-available/sciginie.conf
# จากนั้น:
#   sudo a2enmod rewrite
#   sudo a2enconf sciginie
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# โฟลเดอร์โปรเจกต์ต้องมีไฟล์ admin/login.php จริง เช่น
#   /var/www/sciginie/admin/login.php

Alias /app/sciginie /var/www/sciginie

<Directory /var/www/sciginie>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /app/sciginie/
    </IfModule>
</Directory>

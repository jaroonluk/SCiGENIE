# วางไฟล์นี้บนเซิร์ฟเวอร์คณะ แล้วชี้ URL /app/SCiGENIE ไปยังโฟลเดอร์โปรเจกต์
# ตัวอย่าง: /etc/apache2/conf-available/scigenie.conf
# จากนั้น:
#   sudo a2enmod rewrite
#   sudo a2enconf scigenie
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# โฟลเดอร์โปรเจกต์ต้องมีไฟล์ admin/login.php จริง เช่น
#   /www/app/webroot/SCiGENIE/admin/login.php

Alias /app/SCiGENIE /www/app/webroot/SCiGENIE
Alias /app/scigenie /www/app/webroot/SCiGENIE

<Directory /www/app/webroot/SCiGENIE>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /app/SCiGENIE/
    </IfModule>
</Directory>

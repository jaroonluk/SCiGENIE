services:
  web:
    build: .
    container_name: scigenie
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      TZ: Asia/Bangkok
      SCIGENIE_DB_HOST: host.docker.internal
      SCIGENIE_DB_PORT: 3306
      SCIGENIE_DB_NAME: scigeniedb
      SCIGENIE_DB_USER: ${SCIGENIE_DB_USER:-root}
      SCIGENIE_DB_PASS: ${SCIGENIE_DB_PASS:-}
      EOFFICE_DB_HOST: host.docker.internal
      EOFFICE_DB_PORT: ${EOFFICE_DB_PORT:-3306}
      EOFFICE_DB_NAME: ${EOFFICE_DB_NAME:-eoffice}
      EOFFICE_DB_USER: ${EOFFICE_DB_USER:-root}
      EOFFICE_DB_PASS: ${EOFFICE_DB_PASS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_WEBHOOK_URL: ${LINE_WEBHOOK_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
